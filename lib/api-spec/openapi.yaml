openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scenarios
    description: Sahmi learning scenarios
paths:
  /game:
    get:
      operationId: getSahmiGame
      summary: Read the current anonymous session game
      responses:
        "200":
          description: Current game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: No active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: startSahmiGame
      summary: Start a new anonymous game and set an HttpOnly session cookie
      responses:
        "201":
          description: New game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /game/decisions:
    post:
      operationId: submitSahmiDecision
      summary: Validate, calculate, and atomically save a session decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameDecisionInput"
      responses:
        "200":
          description: Saved game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid decision or insufficient funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Decision already submitted or stale version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scenarios/{scenarioId}:
    get:
      operationId: getSahmiScenario
      tags: [scenarios]
      summary: Get an investing learning scenario
      description: Returns the stored scenario, historical prices, events, and prewritten Arabic explanations
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: '^[a-z0-9-]+$'
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SahmiScenario"
        "404":
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid scenario identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: MongoDB connection unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Scenario could not be read or validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    AssetAmounts:
      type: object
      additionalProperties: false
      required: [stockFund, bondFund, gold, cash]
      properties:
        stockFund: { type: number, minimum: 0 }
        bondFund: { type: number, minimum: 0 }
        gold: { type: number, minimum: 0 }
        cash: { type: number, minimum: 0 }
    GameDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, version]
      properties:
        decision: { type: integer, minimum: 1, maximum: 3 }
        version: { type: integer, minimum: 0 }
        amounts:
          $ref: "#/components/schemas/AssetAmounts"
        action: { type: string, enum: [hold, sell, buy] }
        asset: { type: string, enum: [stockFund, bondFund, gold] }
        amountKd: { type: number, minimum: 0 }
    SavedGameDecision:
      type: object
      required: [decision, month, choice, explanation, balances, totalKd]
      properties:
        decision: { type: integer }
        month: { type: string }
        choice: { type: string }
        explanation: { type: string }
        balances:
          $ref: "#/components/schemas/AssetAmounts"
        totalKd: { type: number }
    MonthlyPlaybackPoint:
      type: object
      additionalProperties: false
      required: [month, totalKd]
      properties:
        month: { type: string }
        totalKd: { type: number, minimum: 0 }
    FinalOutcome:
      type: object
      additionalProperties: false
      required:
        - score
        - diversificationScore
        - calmScore
        - cashReadinessScore
        - badgeTitle
        - badgeText
        - diversificationText
        - calmText
        - cashReadinessText
        - expenseNote
        - portfolioChangeKd
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        diversificationScore: { type: integer, minimum: 0, maximum: 40 }
        calmScore: { type: integer, minimum: 0, maximum: 30 }
        cashReadinessScore: { type: integer, minimum: 0, maximum: 30 }
        badgeTitle: { type: string }
        badgeText: { type: string }
        diversificationText: { type: string }
        calmText: { type: string }
        cashReadinessText: { type: string }
        expenseNote: { type: string }
        portfolioChangeKd: { type: number }
    GameState:
      type: object
      required: [version, nextDecision, month, balances, totalKd, startingSavingsKd, expensePaidKd, decisions, buyDisabledReason, monthlyPlayback, finalOutcome]
      properties:
        version: { type: integer }
        nextDecision: { type: integer, minimum: 1, maximum: 4 }
        month: { type: string }
        balances:
          $ref: "#/components/schemas/AssetAmounts"
        totalKd: { type: number }
        startingSavingsKd: { type: number }
        expensePaidKd: { type: number }
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/SavedGameDecision"
        buyDisabledReason: { type: ["string", "null"] }
        monthlyPlayback:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPlaybackPoint"
        finalOutcome:
          oneOf:
            - $ref: "#/components/schemas/FinalOutcome"
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SahmiScenario:
      type: object
      properties:
        scenarioId:
          type: string
        title:
          type: string
        periodLabel:
          type: string
        dataInfo:
          $ref: "#/components/schemas/ScenarioDataInfo"
        player:
          $ref: "#/components/schemas/ScenarioPlayer"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioAsset"
        monthlyPrices:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPrices"
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioEvent"
        decisionExplanations:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/DecisionExplanation"
        disclaimer:
          type: string
        gameTexts:
          type: object
          additionalProperties:
            type: string
      required:
        - scenarioId
        - title
        - periodLabel
        - dataInfo
        - player
        - assets
        - monthlyPrices
        - events
        - decisionExplanations
        - disclaimer
        - gameTexts
    ScenarioPlayer:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        startingSavingsKd:
          type: number
        goal:
          type: string
        goalMonths:
          type: integer
      required: [name, age, startingSavingsKd, goal, goalMonths]
    ScenarioAsset:
      type: object
      properties:
        id:
          type: string
          enum: [stockFund, bondFund, gold, cash]
        label:
          type: string
        symbol:
          type: ["string", "null"]
        source:
          type: string
        description:
          type: string
        riskLabel:
          type: ["string", "null"]
      required: [id, label, symbol, source, description, riskLabel]
    MonthlyPrices:
      type: object
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        stockFund:
          type: number
        bondFund:
          type: number
        gold:
          type: number
        cash:
          type: number
      required: [month, stockFund, bondFund, gold, cash]
    ScenarioEvent:
      type: object
      properties:
        id:
          type: string
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        type:
          type: string
          enum: [marketDrop, surpriseExpense]
        title:
          type: string
        description:
          type: string
        amountKd:
          type: ["number", "null"]
      required: [id, month, type, title, description, amountKd]
    DecisionExplanation:
      type: object
      properties:
        decision:
          type: integer
          minimum: 1
          maximum: 3
        title:
          type: string
        text:
          type: string
      required: [decision, title, text]
    ScenarioDataInfo:
      type: object
      properties:
        sourceName:
          type: string
        retrievedOn:
          type: string
        priceCurrency:
          type: string
        pricingNote:
          type: string
        limitations:
          type: string
      required: [sourceName, retrievedOn, priceCurrency, pricingNote, limitations]

